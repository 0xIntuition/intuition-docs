name: Validate Candidate Guide

on:
  pull_request:
    branches: [main, feature/knowledge-graph-developer-docs]
    paths:
      - 'docs/_data/build/**'
      - 'scripts/*candidate*.js'
      - 'scripts/*package-reference*.js'
      - 'scripts/__fixtures__/candidate-examples/**'
      - 'static/intuition-release.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-candidate-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-candidate:
    name: Validate pinned candidate examples and references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Read and validate selected candidate pin
        id: candidate
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const manifest = require('./static/intuition-release.json');
          if (manifest.source.repository !== 'https://github.com/0xIntuition/packages' ||
              !/^[0-9a-f]{40}$/.test(manifest.source.commit)) {
            throw new Error('Expected an exact 0xIntuition/packages source pin');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${manifest.source.commit}\n`);
          JS

      - name: Acquire exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 0xIntuition/packages
          ref: ${{ steps.candidate.outputs.commit }}
          path: .docusaurus/candidate-packages
          persist-credentials: false

      - name: Install docs dependencies and candidate package manager
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/candidate-bun" --no-save bun@1.3.3
          echo "$RUNNER_TEMP/candidate-bun/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install frozen candidate dependencies
        working-directory: .docusaurus/candidate-packages
        run: bun install --frozen-lockfile

      - name: Build candidate code packages
        run: node scripts/build-candidate-packages.js .docusaurus/candidate-packages

      - name: Test reference type provenance
        run: node --test scripts/package-reference-types.test.js

      - name: Check candidate guide snippets and offline identity invariants
        run: npm run validate-candidate-examples -- .docusaurus/candidate-packages

      - name: Prove an invalid candidate import fails the gate
        run: node scripts/test-candidate-gate.js .docusaurus/candidate-packages

      - name: Check generated reference and manifest bytes
        run: npm run generate-package-reference -- .docusaurus/candidate-packages --check
