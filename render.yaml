services:
  - type: web
    name: intuition-docs
    env: static
    previews:
      generation: automatic
    buildCommand: npm ci; npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /docs/*
        destination: /docs/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DOCUSAURUS_IGNORE_SSG_WARNINGS
        value: 'true'
    headers:
      - path: /docs.md
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: /docs/*.md
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: /docs/**/*.md
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: /docs/v1/*
        name: X-Robots-Tag
        value: noindex
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
