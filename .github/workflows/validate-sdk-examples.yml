name: Validate SDK Examples

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/_data/**'
      - '_data_versioned_docs/**'
      - 'examples/v2/**'
      - 'static/intuition-release.json'
      - 'scripts/**'
      - 'docs-versions.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-sdk-examples.yml'

permissions:
  contents: read

jobs:
  validate-sdk-examples:
    name: Validate SDK examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated V2 dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix examples/v2

      - name: Typecheck SDK documentation examples
        run: npm run validate-sdk-examples

      - name: Verify historical atom identity preservation offline
        run: node --test examples/v2/first-write/migration.test.ts

      - name: Check synchronized V2 source regions
        run: node scripts/sync-example-snippets.js --check

      - name: Verify the offline quickstart output
        run: |
          node --experimental-strip-types examples/v2/quickstart/quickstart.ts > "$RUNNER_TEMP/quickstart-output.txt"
          diff -u examples/v2/quickstart/expected-output.txt "$RUNNER_TEMP/quickstart-output.txt"
