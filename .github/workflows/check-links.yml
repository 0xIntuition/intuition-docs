name: Check Internal Links

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-links:
    name: Validate internal links and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run validate-links
      - run: npm run validate-llms-coverage
      - run: npm test

  build:
    name: Docusaurus build and version assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - name: Build site and preserve redirect diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - run: npm run validate-url-baseline
      - run: npm run validate-version-equivalents
      - run: node scripts/validate-built-docs.js --phase 3 --build-log build.log
